pluginGroup=de.berger.gradletasksview
pluginName=Gradle Tasks Extended
pluginVersion=0.3.4

pluginSinceBuild=263

# Herausgeber und Kontakt fuer plugin.xml und den Info-Dialog (REQ-080). E-Mail und URL
# duerfen leer bleiben - dann zeigt der Dialog nur den Namen.
pluginVendor=Privat
pluginVendorEmail=
pluginVendorUrl=

# Produktcode der Ziel-IDE ("IU" = IntelliJ IDEA Ultimate). Die zugehoerige VERSION steht
# nicht hier, sondern als `intellijIdea` in gradle/libs.versions.toml - dort werden alle
# Abhaengigkeitsversionen zentral verwaltet.
platformType=IU

kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
